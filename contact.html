<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Teun</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

<header class="site-header">
    <div class="container nav-container">
        <div class="logo">Teun</div>

        <nav class="main-nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </div>
</header>

<main class="contact-page">
    <div class="container">

        <h1>Contact</h1>
        <p class="contact-intro">
            Heb je een vraag, wil je samenwerken, of wil je gewoon even hallo zeggen?  
            Stuur me gerust een bericht via het formulier hieronder.
        </p>

        <form class="contact-form" action="https://formsubmit.co/tlj.kersten@gmail.com" method="POST">

            <label for="name">Naam</label>
            <input type="text" id="name" name="name" placeholder="Jouw naam">

            <label for="email">E‑mail</label>
            <input type="email" id="email" name="email" placeholder="jij@example.com">

            <label for="message">Bericht</label>
            <textarea id="message" name="message" rows="5" placeholder="Waar kan ik je mee helpen?"></textarea>

            <button type="submit" class="cta">Versturen</button>
            <input type="hidden" name="_captcha" value="false">
<input type="hidden" name="_template" value="table">
<input type="hidden" name="_next" value="https://teun-kersten.github.io/Portfolio/bedankt.html">

        </form>

    </div>
</main>

</body>
</html>
